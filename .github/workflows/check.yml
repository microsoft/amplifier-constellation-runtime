name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            executable: agent-runtime
            python: '3.12'
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
            executable: agent-runtime
            python: '3.12'
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos-aarch64
            executable: agent-runtime
            python: '3.12'
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
            executable: agent-runtime
            python: '3.12'
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            executable: agent-runtime.exe
            python: '3.12'
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform: windows-aarch64
            executable: agent-runtime.exe
            python: '3.13'
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      AGENT_RUNTIME_TEST_BINARY: ${{ github.workspace }}/target/${{ matrix.target }}/debug/${{ matrix.executable }}
      RUNTIME_BINARY: ${{ github.workspace }}/target/${{ matrix.target }}/debug/${{ matrix.executable }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - name: Include the Windows C runtime in the executable
        if: runner.os == 'Windows'
        shell: bash
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: |
          target_env="${NATIVE_TARGET//-/_}"
          echo "CARGO_TARGET_${target_env^^}_RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - run: python tests/package_release.py
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --features windows-appcontainer -- -D warnings
        if: runner.os == 'Windows'
      - run: cargo test --locked --features windows-appcontainer --lib windows_command::tests -- --test-threads=1
        if: runner.os == 'Windows'
      - run: cargo test --locked --features windows-appcontainer --test windows_commands -- --test-threads=1
        if: runner.os == 'Windows'
        env:
          COMMAND_TEST_SECRET: must-not-reach-the-command
          COMMAND_TEST_TOKEN: must-not-reach-the-command
      - run: cargo build --locked --features windows-appcontainer
        if: runner.os == 'Windows'
      - run: python tests/windows_protocol.py
        if: runner.os == 'Windows'
      - run: cargo test --locked
        env:
          COMMAND_TEST_SECRET: must-not-reach-the-command
          COMMAND_TEST_TOKEN: must-not-reach-the-command
      - run: cargo build --locked
      - run: python tests/helper_bounds.py
      - run: python tests/container_commands.py
        if: runner.os == 'Linux'
      - run: python tests/steering.py
      - run: python tests/native_context.py
      - run: python tests/context_capacity.py
      - run: python tests/steering_fallback.py
      - run: python tests/steering_pause.py
      - run: python tests/protocol.py
      - run: python tests/images.py
      - run: python tests/providers.py
      - run: python tests/provider_identity.py
      - run: python tests/model_selection.py
      - run: python tests/capabilities.py
      - run: python tests/computer.py
      - run: python tests/management.py
      - run: python tests/copilot_protocol.py
      - run: python -m pip install -r bridges/copilot/requirements.txt
        if: runner.os == 'Linux'
      - run: python tests/copilot_bridge.py
        if: runner.os == 'Linux'
      - run: python tests/install.py
        if: runner.os == 'Linux'
      - run: cargo build --release --locked
      - name: Verify and package the actual native release
        env:
          AGENT_RUNTIME_TEST_BINARY: ${{ github.workspace }}/target/${{ matrix.target }}/release/${{ matrix.executable }}
          RUNTIME_BINARY: ${{ github.workspace }}/target/${{ matrix.target }}/release/${{ matrix.executable }}
        run: |
          python tests/helper_bounds.py
          python tests/protocol.py
          python tests/provider_identity.py
          python tests/windows_protocol.py
          python scripts/package-release.py --binary "${{ github.workspace }}/target/${{ matrix.target }}/release/${{ matrix.executable }}" --platform "${{ matrix.platform }}" --source "${{ github.sha }}" --output dist
      - uses: actions/upload-artifact@v4
        with:
          name: agent-runtime-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: |
            target/${{ matrix.target }}/release/${{ matrix.executable }}
            dist/*
          if-no-files-found: error
  computer-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        working-directory: examples/computer
      - run: npx playwright install --with-deps chromium
        working-directory: examples/computer
      - run: node --test tests/computer_browser.mjs
