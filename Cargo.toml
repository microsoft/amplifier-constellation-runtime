[package]
name = "agent-runtime"
version = "0.10.2"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"
repository = "https://github.com/microsoft/amplifier-constellation-runtime"
description = "Native Rust ACP agent engine, provider and tool execution, durable sessions."

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
cap-std = "=3.4.5"
fs2 = "0.4"
futures-util = "0.3"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
jsonwebtoken = { version = "10.3", features = ["aws_lc_rs"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
webpki-roots = "1"
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
tempfile = "3"

[features]
default = ["windows-appcontainer"]
windows-appcontainer = []

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Environment", "Win32_System_SystemInformation", "Win32_System_SystemServices"] }
